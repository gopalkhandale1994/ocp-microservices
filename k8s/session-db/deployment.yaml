apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-db
  labels:
    app: session-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session-db
  template:
    metadata:
      labels:
        app: session-db
    spec:
      serviceAccountName: sock-shop-data
      containers:
        - name: session-db
          # Stock public image. front-end's config.js hardcodes this Redis
          # host as "session-db" for its express-session store.
          image: redis:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
