apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: ghcr.io/gopalkhandale1994/ocp-microservices-orders:0.5.0
          imagePullPolicy: IfNotPresent
          # Original ENTRYPOINT binds privileged port 80 via the base image's
          # java.sh wrapper. Override to 8082 (orders' own application.properties
          # default) to avoid needing root/anyuid just for the port choice.
          command:
            - /usr/local/bin/java.sh
            - -jar
            - ./app.jar
            - --port=8082
          # This base image's JDK8 build predates reliable cgroup-aware heap
          # sizing: without an explicit -Xmx it was sizing its default heap
          # off the *node's* total memory, not this container's limit, and
          # getting OOMKilled well under the limit as a result.
          env:
            - name: JAVA_OPTS
              value: "-Xms64m -Xmx512m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom"
          ports:
            - containerPort: 8082
          # No httpGet probe: orders disables the Actuator health endpoint.
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 1Gi
