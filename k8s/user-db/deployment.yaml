apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-db
  labels:
    app: user-db
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      # No fsGroup specified: this namespace's restricted-v2 SCC only allows
      # fsGroup values from its own pre-allocated range, and rejects an
      # arbitrary one like 1000. Omitting it lets OpenShift auto-assign a
      # valid value from that range, same as it does for the container UID.
      containers:
        - name: user-db
          # Stock public image, unseeded. The original Sock Shop demo used a
          # custom weaveworksdemos/user-db image pre-loaded with sample users,
          # but that image's source isn't in any of the 8 repos we vendored --
          # it lived in a separate, unlisted repo. Using plain mongo means you
          # register your own test users through the app instead of having
          # demo accounts available out of the box.
          #
          # Using MongoDB Inc's own quay.io image, not bitnami or library/mongo:
          # library/mongo (any tag) is blocked by this Sandbox's internal pull
          # mirror (403/bad credentials, confirmed across several tags), and
          # bitnami's free-tier catalog no longer publishes any version but
          # :latest (MongoDB 8.x) -- which `user`'s ~2017-era Go mgo driver
          # can't handshake with. This quay.io image still offers real pinned
          # older versions and isn't subject to the mirror rewrite.
          image: quay.io/mongodb/mongodb-community-server:4.4.29-ubi8
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: data
              mountPath: /data/db
          ports:
            - containerPort: 27017
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          emptyDir: {}
