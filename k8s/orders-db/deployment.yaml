apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-db
  labels:
    app: orders-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  template:
    metadata:
      labels:
        app: orders-db
    spec:
      # No fsGroup specified: this namespace's restricted-v2 SCC only allows
      # fsGroup values from its own pre-allocated range, and rejects an
      # arbitrary one. Omitting it lets OpenShift auto-assign a valid value
      # from that range, same as it does for the container UID.
      containers:
        - name: orders-db
          # Stock public image, not built from any of our submodules.
          #
          # Using MongoDB Inc's own quay.io image, not bitnami or
          # library/mongo: library/mongo (any tag) is blocked by this
          # Sandbox's internal pull mirror (403/bad credentials, confirmed
          # across several tags). bitnami/mongodb:latest (MongoDB 8.x)
          # pulled fine, but a real e2e order-placement test caught it
          # rejecting writes from orders' driver with "Unsupported OP_QUERY
          # command: insert" (code 352) -- orders runs 2016-era Spring Boot
          # 1.4.4, whose Mongo driver still issues the legacy OP_QUERY
          # wire-protocol opcodes that MongoDB removed entirely in 5.1+.
          # This quay.io image offers real pinned older versions that still
          # speak that protocol (same fix already applied to user-db).
          image: quay.io/mongodb/mongodb-community-server:4.4.29-ubi8
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: data
              mountPath: /data/db
          ports:
            - containerPort: 27017
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          emptyDir: {}
