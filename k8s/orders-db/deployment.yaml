apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-db
  labels:
    app: orders-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  template:
    metadata:
      labels:
        app: orders-db
    spec:
      containers:
        - name: orders-db
          # Stock public image -- not built from any of our submodules.
          # Using bitnami/mongodb, not library/mongo: this Sandbox cluster
          # transparently rewrites all "mongo" pulls through an internal
          # mirror that 403s with bad credentials (confirmed same failure
          # across mongo:4.4/5.0/6.0) -- outside our control from this
          # namespace. bitnami/mongodb isn't subject to that rewrite, and is
          # also built to run under an arbitrary UID, so no anyuid SCC needed.
          image: bitnami/mongodb:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ALLOW_EMPTY_PASSWORD
              value: "yes"
          ports:
            - containerPort: 27017
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
