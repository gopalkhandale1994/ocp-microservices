apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-master
  labels:
    app: queue-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue-master
  template:
    metadata:
      labels:
        app: queue-master
    spec:
      containers:
        - name: queue-master
          image: ghcr.io/gopalkhandale1994/ocp-microservices-queue-master:0.4.0
          imagePullPolicy: IfNotPresent
          # Image's own ENTRYPOINT binds port 80 and relies on a build-time
          # setcap grant to do it as non-root -- OpenShift's restricted SCC
          # drops runtime capabilities regardless, so override to 8080 (this
          # service's own application.properties default) to sidestep it.
          command:
            - java
            - -Djava.security.egd=file:/dev/urandom
            - -jar
            - ./app.jar
            - --port=8080
          ports:
            - containerPort: 8080
          # No httpGet probe: health endpoint disabled via application.properties.
          # RabbitMQ host is hardcoded to "rabbitmq" -- Service name must match.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 640Mi
