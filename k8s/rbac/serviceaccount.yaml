apiVersion: v1
kind: ServiceAccount
metadata:
  name: sock-shop-data
---
# MySQL/Mongo/RabbitMQ/Redis stock images own their data dirs as fixed non-root
# UIDs baked in at image build time, without group-0 write perms. OpenShift's
# default "restricted" SCC assigns a random arbitrary UID at runtime, which can't
# write to those dirs. Binding this SA to "anyuid" lets datastore pods run as the
# image's intended UID instead. Only datastore Deployments use this SA — the app
# services (front-end/catalogue/carts/orders/shipping/payment/user/queue-master)
# run fine under the default restricted SCC and use the default ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sock-shop-data-anyuid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: sock-shop-data
