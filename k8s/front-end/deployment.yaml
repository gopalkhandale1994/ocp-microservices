apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-end
  labels:
    app: front-end
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: front-end
  template:
    metadata:
      labels:
        app: front-end
    spec:
      containers:
        - name: front-end
          image: ghcr.io/gopalkhandale1994/ocp-microservices-front-end:0.6.1
          imagePullPolicy: IfNotPresent
          env:
            - name: SESSION_REDIS
              value: "true"
          ports:
            - containerPort: 8079
          readinessProbe:
            tcpSocket:
              port: 8079
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8079
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
