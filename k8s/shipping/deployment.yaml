apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  labels:
    app: shipping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping
  template:
    metadata:
      labels:
        app: shipping
    spec:
      containers:
        - name: shipping
          image: ghcr.io/gopalkhandale1994/ocp-microservices-shipping:0.5.0
          imagePullPolicy: IfNotPresent
          # Override privileged port 80 -> shipping's own application.properties
          # default of 8080, avoiding the need for root/anyuid.
          command:
            - /usr/local/bin/java.sh
            - -jar
            - ./app.jar
            - --port=8080
          # This base image's JDK8 build predates reliable cgroup-aware heap
          # sizing: without an explicit -Xmx it was sizing its default heap
          # off the *node's* total memory, not this container's limit, and
          # getting OOMKilled well under the limit as a result.
          env:
            - name: JAVA_OPTS
              value: "-Xms64m -Xmx512m -XX:+UseG1GC -Djava.security.egd=file:/dev/urandom"
          ports:
            - containerPort: 8080
          # No httpGet probe: shipping disables the Actuator health endpoint
          # even though the dependency is present.
          # RabbitMQ host is hardcoded to "rabbitmq" in application.properties --
          # the Service below must be named exactly that.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 1Gi
