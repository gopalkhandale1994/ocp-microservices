name: Build

# Push a tag like v0.1.0 to validate manifests, run the Java services'
# unit tests, then build & push all 9 images. Deploying is a separate
# workflow (deploy.yml): it runs automatically once this succeeds, and can
# *also* be re-run on its own -- without rebuilding anything -- whenever
# you're just iterating on k8s/ manifests or the deploy/smoke-test steps
# themselves. That split is the whole point: re-running this one costs
# ~10 minutes across 9 image builds; re-running deploy.yml alone costs
# under a minute.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. 0.1.0), must match k8s manifests'
        required: true
        default: '0.1.0'

jobs:

  # ---------------------------------------------------------------------
  # Stage 1: validate the K8s manifests before spending any time building.
  # Pure static check, no cluster credentials touched here.
  # ---------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 test/validate_manifests.py

  # ---------------------------------------------------------------------
  # Stage 2: run the Java services' actual unit tests. Separate from the
  # build stage so a real test failure blocks the pipeline before any
  # image gets built, not after.
  # ---------------------------------------------------------------------
  unit-test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: carts
            maven_dir: services/carts
            pom_override: docker/carts/pom.xml
            src_override: docker/carts/src-override
          - name: orders
            maven_dir: services/orders
          - name: shipping
            maven_dir: services/shipping
            src_override: docker/shipping/src-override
            resource_override: docker/shipping/resource-override
          - name: queue-master
            maven_dir: services/queue-master
            resource_override: docker/queue-master/resource-override
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Apply pom.xml override
        if: matrix.pom_override != ''
        run: cp ${{ matrix.pom_override }} ${{ matrix.maven_dir }}/pom.xml

      - name: Apply source overrides
        if: matrix.src_override != ''
        run: cp -rv ${{ matrix.src_override }}/. ${{ matrix.maven_dir }}/src/main/java/

      - name: Apply resource overrides
        if: matrix.resource_override != ''
        run: cp -rv ${{ matrix.resource_override }}/. ${{ matrix.maven_dir }}/src/main/resources/

      - name: mvn test
        run: mvn -f ${{ matrix.maven_dir }}/pom.xml test

  # ---------------------------------------------------------------------
  # Stage 3: build and push all 9 custom images, only once tests pass.
  # ---------------------------------------------------------------------
  build-and-push:
    needs: unit-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: front-end
            context: services/front-end
            dockerfile: services/front-end/Dockerfile
            overlay: docker/front-end/src-override
          - name: catalogue
            context: services/catalogue
            dockerfile: services/catalogue/docker/catalogue/Dockerfile
            strip_git: "true"
          - name: catalogue-db
            context: services/catalogue/docker/catalogue-db
            dockerfile: services/catalogue/docker/catalogue-db/Dockerfile
          - name: carts
            context: services/carts
            maven_dir: services/carts
            dockerfile: docker/carts/Dockerfile
            build_tool: maven
            pom_override: docker/carts/pom.xml
            src_override: docker/carts/src-override
          - name: orders
            # context is .../target, not the repo root: orders' Dockerfile does
            # "COPY *.jar" (not "./target/*.jar"), expecting the jar directly
            # at the context root -- matches where `mvn package` puts it.
            # maven_dir stays at the submodule root, where pom.xml actually is.
            context: services/orders/target
            maven_dir: services/orders
            dockerfile: services/orders/docker/orders/Dockerfile
            build_tool: maven
          - name: shipping
            context: services/shipping/target
            maven_dir: services/shipping
            dockerfile: services/shipping/docker/shipping/Dockerfile
            build_tool: maven
            src_override: docker/shipping/src-override
            resource_override: docker/shipping/resource-override
          - name: payment
            context: services/payment
            dockerfile: services/payment/docker/payment/Dockerfile
            strip_git: "true"
          - name: user
            context: services/user
            dockerfile: services/user/Dockerfile
          - name: queue-master
            context: services/queue-master
            maven_dir: services/queue-master
            dockerfile: docker/queue-master/Dockerfile
            build_tool: maven
            resource_override: docker/queue-master/resource-override
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 8
        if: matrix.build_tool == 'maven'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Apply pom.xml override
        if: matrix.pom_override != ''
        # carts' real pom.xml lives in a read-only submodule we can't push
        # fixes to, so the corrected copy lives in our own repo instead and
        # gets spliced in here before the Maven build runs.
        run: cp ${{ matrix.pom_override }} ${{ matrix.maven_dir }}/pom.xml

      - name: Apply source overrides
        if: matrix.src_override != ''
        # Same idea as the pom.xml override, for individual .java files that
        # needed fixing but live in a read-only submodule.
        run: cp -rv ${{ matrix.src_override }}/. ${{ matrix.maven_dir }}/src/main/java/

      - name: Apply resource overrides
        if: matrix.resource_override != ''
        # Same idea, for application.properties -- covers the actuator
        # hardening for shipping/queue-master.
        run: cp -rv ${{ matrix.resource_override }}/. ${{ matrix.maven_dir }}/src/main/resources/

      - name: Apply file overlay
        if: matrix.overlay != ''
        # Generic version of the same idea for non-Java services: copies
        # fixed files straight onto the submodule root, preserving relative
        # paths (e.g. docker/front-end/src-override/api/orders/index.js ->
        # services/front-end/api/orders/index.js).
        run: cp -rv ${{ matrix.overlay }}/. ${{ matrix.context }}/

      - name: Build jar with Maven
        if: matrix.build_tool == 'maven'
        # Tests already ran as their own pipeline stage; skip re-running
        # them here, we just need the jar.
        run: mvn -f ${{ matrix.maven_dir }}/pom.xml package -DskipTests

      - name: Strip submodule .git marker
        if: matrix.strip_git == 'true'
        # This is a submodule, so .git here is a one-line gitlink file
        # pointing at ../../.git/modules/<path> -- a location that doesn't
        # exist inside the Docker build context. Git hard-fails on ANY
        # command (even unrelated ones like gvt's dependency probing) when
        # it finds a broken gitlink, so it has to go before the build.
        run: rm -f ${{ matrix.context }}/.git

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ocp-microservices-${{ matrix.name }}:${{ steps.version.outputs.value }}
