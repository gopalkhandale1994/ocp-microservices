name: Image Scan

# Trivy scan of the actual container images pushed to GHCR by Build --
# OS packages and language dependencies baked into each image, which
# CodeQL (source-only) never sees. Runs after Build succeeds, and can also
# be re-run on its own without rebuilding anything: the image tag is read
# straight out of k8s/<service>/deployment.yaml, the same source of truth
# deploy.yml uses, so there's no separate version input to keep in sync.
on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
  workflow_dispatch: {}

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        name:
          - front-end
          - catalogue
          - catalogue-db
          - carts
          - orders
          - shipping
          - payment
          - user
          - queue-master
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read image ref from k8s manifest
        id: image
        run: |
          ref=$(grep -oP '(?<=image: ).*' k8s/${{ matrix.name }}/deployment.yaml)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan ${{ matrix.name }} with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          # Informational, like the CodeQL job -- doesn't fail the run.
          exit-code: '0'

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: "trivy-${{ matrix.name }}"
