server.port=${port:8080}
spring.rabbitmq.host=rabbitmq
endpoints.health.enabled=false
spring.zipkin.baseUrl=http://${zipkin_host:zipkin}:9411/
spring.zipkin.enabled=${zipkin_enabled:false}
spring.sleuth.sampler.percentage=1.0
spring.application.name=shipping
# Disable actuator metrics endpoints
endpoints.metrics.enabled=false
# Actuator endpoints (env, dump, trace, mappings, beans, configprops...) are
# unauthenticated by default on this Spring Boot version -- there's no
# spring-boot-starter-security on the classpath to gate them -- and nothing
# here uses actuator at runtime (health/metrics are already off, probes are
# plain TCP), so disable the rest instead of leaving them reachable.
endpoints.enabled=false
